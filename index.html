<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bildgenerator - Supabase & Vercel</title>
    <!-- Ladda Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        textarea { width: 100%; height: 120px; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; resize: vertical; margin-bottom: 1.5rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #7dd3fc; }
        #status { margin-top: 1rem; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎨 AI Bildgenerator</h1>
        
        <label for="prompt">Din Prompt:</label>
        <textarea id="prompt" placeholder="Beskriv bilden du vill generera..."></textarea>
        
        <button onclick="skickaTillSupabase()">Generera & Spara</button>
        
        <div id="status"></div>
    </div>

    <script>
        // 1. Koppla in dina Supabase-uppgifter här (från din Supabase Dashboard -> Settings -> API)
        const SUPABASE_URL = 'DIN_SUPABASE_URL_HÄR';
        const SUPABASE_ANON_KEY = 'DIN_SUPABASE_ANON_KEY_HÄR';
        
        // Initiera Supabase-klienten
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function skickaTillSupabase() {
            const prompt = document.getElementById('prompt').value;
            const statusDiv = document.getElementById('status');
            
            if (!prompt.trim()) {
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = 'Vänligen fyll i en prompt!';
                return;
            }

            statusDiv.style.color = '#38bdf8';
            statusDiv.innerText = 'Sparar till Supabase och anropar AI...';

            try {
                // Exempel: Spara prompten till en tabell som heter 'prompts' i din Supabase-databas
                const { data, error } = await supabase
                    .from('prompts')
                    .insert([{ prompt_text: prompt, status: 'pending' }]);

                if (error) throw error;

                statusDiv.style.color = '#4ade80';
                statusDiv.innerText = '✅ Prompt sparad i databasen!';
                document.getElementById('prompt').value = '';

            } catch (err) {
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = '❌ Fel vid sparande: ' + err.message;
            }
        }
    </script>
</body>
</html>
